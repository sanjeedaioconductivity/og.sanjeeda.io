openapi: 3.0.3
info:
  title: OfferGuide API
  version: 2.0.0
  description: >
    OfferGuide (sanjeeda.io career services portal) backend contract.


    Sprint 8 completed this file. Sprints 1–7 shipped 34 paths but only
    Sprint 5's own 13 were ever documented here, which made Story 8.1.1
    ("verify every endpoint in Swagger") impossible to execute. Every route
    that exists in `src/app/api/offerguide/` is now declared, with its auth
    mode, status codes and response shape.


    ## Auth modes

    Four modes, named exactly as the Sprint 8 handoff §3.1 table names them:


    * **PUBLIC** — no cookie, no token. Reference data only.

    * **guestOrAuth** — a `guestToken` httpOnly cookie **or** a portal JWT.
      Behaviour is identical either way, scoped to whichever identity is
      present; a JWT wins when both are sent. Never returns one candidate's
      data to another.

    * **bearerAuth** — a portal JWT only. A guest cookie is rejected.

    * **adminAuth** — a portal JWT whose account's stored `role` is `admin`.
      Rejects no credentials, a guest cookie, and an ordinary registered-user
      JWT alike. The role is read from the database on every check, so a
      demotion takes effect immediately rather than at the next token expiry.

    ### Swagger UI limitation (read before verifying)

    The **Authorize** button can only drive the JWT cases. It cannot attach the
    `guestToken` httpOnly cookie. Every `guestOrAuth` operation must therefore
    be verified **twice**: once here with a JWT, and once outside Swagger
    (browser or `curl -b`) with only the guest cookie present. Both must return
    the same shape.

    `adminAuth` and `bearerAuth` are the same credential — one bearer JWT — so
    authorizing once covers both. Which of the two a request satisfies depends
    on the account behind the token, not on anything the client sends.


    ## Contract-level integrity rules

    * Scoring config versions are **immutable**. There is no PUT or PATCH on
      `/admin/config/scoring` — a new version is a POST, and previously
      computed scores are never retroactively changed.

    * Retiring the master consent toggle (`consent_share_anonymous`) returns
      **409**. It would orphan every candidate's stored consent preference.

    * Every `/admin/config/*` DELETE is a **soft delete**: it sets
      `active: false` and returns the retired document. Nothing is ever
      hard-deleted, because a retired question still has to explain the
      meaning of evaluations scored while it was live.

    * `GET /config/questions` returns the `QuestionPublic` shape and leaks
      **no** scoring data — no `scoreType`, no option scores, no
      `numericBands`, no `nullScore`, no multipliers.


    ## Operation count

    The Sprint 8 handoff §3.1 inventory is **54 operations across 34 paths**,
    and all 54 are declared below. Four additional item-level `GET`s
    (geography, market-benchmarks, functional-domains, consent-toggles) also
    exist in code — Sprint 5 shipped them via the shared CRUD factory. They
    are declared here too, tagged `Superset`, because an undeclared reachable
    admin route is worse than a count that doesn't match the table. They are
    not part of the §3.1 checklist.


    ## Field inventories

    The per-screen field sets (SCR-001's 24 fields, SCR-005's 13, and so on)
    live in each screen's FRS and are verified there, per Story 8.2.1. The
    flat sub-resource PATCH bodies below are typed as objects of scalar
    answer fields rather than restating ~150 columns.

servers:
  - url: http://localhost:3000

tags:
  - name: Candidate Profile
    description: Candidate-level identity, answers and consent (SCR-001).
  - name: Evaluation Sessions
    description: One evaluation run (SCR-002), holding one or more offers.
  - name: Offers
    description: Per-offer detail and the screen-scoped answer sub-resources.
  - name: Scoring
    description: Compute and read an offer's score (SCR-010).
  - name: Wizard Draft
    description: Autosaved in-progress answers. 30-day TTL.
  - name: Public Config
    description: Candidate-safe reference data. No auth of any kind.
  - name: Admin Config
    description: >
      Swagger/script/curl-only endpoints — no admin UI exists. Every route here
      requires a portal JWT whose account's stored role is `admin` (see
      AdminAuth). Roles are assigned by migration script and operational action
      only; there is no endpoint here or anywhere else that changes one.
  - name: Superset
    description: >
      Reachable in code but outside the handoff §3.1 inventory of 54.
      Declared so nothing admin-facing is undocumented.

# Default: no auth. Each operation states its own mode explicitly.
security: []

paths:
  /api/ping:
    get:
      tags: [Public Config]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ===========================================================================
  # Candidate profile & guest claim — operations 1–5
  # ===========================================================================
  /api/offerguide/candidate-profile:
    get:
      tags: [Candidate Profile]
      summary: Get the caller's candidate profile
      description: guestOrAuth. Scoped to the caller's own identity.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateProfile" }
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Candidate Profile]
      summary: Create the caller's candidate profile
      description: >
        guestOrAuth. With no identity present, mints a `guestToken` and sets
        it as an httpOnly cookie on the response — this is the operation that
        makes a guest a guest.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateProfile" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateProfile" }
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags: [Candidate Profile]
      summary: Update the caller's candidate profile
      description: >
        guestOrAuth. Partial merge — only the fields sent are changed. A
        return visit updates the existing profile rather than creating a
        second one.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateProfile" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateProfile" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/candidate-profile/consent:
    patch:
      tags: [Candidate Profile]
      summary: Update consent settings
      description: >
        guestOrAuth. Consent is **candidate-level**, not session-level, and is
        captured on SCR-001 (SCR-009 shows a read-only reminder). All toggles
        default to Off. Toggle ids are validated against `OgConsentToggles`,
        so an unknown or retired id is a 400 rather than silently stored.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentSettings" }
      responses:
        "200":
          description: The updated consent settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentSettings" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/claim-guest-profile:
    post:
      tags: [Candidate Profile]
      summary: Link a guest profile to the now-registered account
      description: >
        bearerAuth — a guest cookie alone is rejected, since there is no
        account to link to. Sets `userInfoId` on the existing guest row and
        touches nothing else; the answers were already there.


        Known limitation: this only works when the guest cookie is present in
        the same browser. Registering on a different device orphans the guest
        history, and no email-based linking exists.
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: >
            Linked, or nothing to link (no guest cookie, no guest profile, or
            the account already had its own profile — all reported in
            `message` rather than as errors).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Guest profile linked. }
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===========================================================================
  # Evaluation sessions — operations 6–11
  # ===========================================================================
  /api/offerguide/evaluation-sessions:
    get:
      tags: [Evaluation Sessions]
      summary: List the caller's evaluation sessions
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EvaluationSession" }
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Evaluation Sessions]
      summary: Create an evaluation session (SCR-002)
      description: >
        guestOrAuth. Pins `scoringConfigVersion` to the currently active
        config at creation time, so retuning weights later never shifts this
        session's already-computed scores.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluationSession" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationSession" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/evaluation-sessions/{sessionId}:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      tags: [Evaluation Sessions]
      summary: Get one session with its offers
      description: >
        guestOrAuth, ownership-checked. A session belonging to another
        candidate returns 404, not 403 — the contract does not confirm that
        someone else's session exists.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EvaluationSession"
                  - type: object
                    properties:
                      offers:
                        type: array
                        items: { $ref: "#/components/schemas/Offer" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Evaluation Sessions]
      summary: Update a session
      description: >
        guestOrAuth. `evaluationPriorities` enforces minimum 1 and maximum 3
        selections; "Other" free text is stored in
        `evaluationPriorityOtherText` and is not mapped to any category.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluationSession" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationSession" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/evaluation-sessions/{sessionId}/compare:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      tags: [Evaluation Sessions]
      summary: Compare every offer in the session (SCR-009)
      description: >
        guestOrAuth. Returns each offer with its stored score plus the
        comparison outcome. **The winner is decided server-side** — a
        comparison in the frontend that produces a displayed value is a
        defect. `winnerOfferIds` is a list because a tie badges every offer
        sharing the top score, with `isTie` stated explicitly so the client
        never infers it. Offers that have never been scored carry
        `score: null`, do not win, and do not create a tie.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionComparison" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/evaluation-sessions/{sessionId}/offers:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      tags: [Evaluation Sessions]
      summary: Add an offer to the session (SCR-003)
      description: >
        guestOrAuth. Used both for the first offer and for the multi-offer
        loop from SCR-009, which returns here and then runs SCR-003 → SCR-008
        again for the new offer.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Offer" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Offers & scoring — operations 12–21
  # ===========================================================================
  /api/offerguide/offers/{offerId}:
    parameters: [{ $ref: "#/components/parameters/OfferId" }]
    get:
      tags: [Offers]
      summary: Get one offer with all its answer sub-resources
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferFull" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Offers]
      summary: Update SCR-003 offer detail fields
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Offer" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Offers]
      summary: Delete an offer from the session
      description: >
        guestOrAuth. Deleting one offer from a multi-offer session leaves the
        session and the remaining offers intact.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/offers/{offerId}/compensation:
    parameters: [{ $ref: "#/components/parameters/OfferId" }]
    patch:
      tags: [Offers]
      summary: Update SCR-004 compensation answers
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerPatch" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/offers/{offerId}/benefits-security:
    parameters: [{ $ref: "#/components/parameters/OfferId" }]
    patch:
      tags: [Offers]
      summary: Update SCR-005 benefits & security answers (13 fields)
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerPatch" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/offers/{offerId}/worklife:
    parameters: [{ $ref: "#/components/parameters/OfferId" }]
    patch:
      tags: [Offers]
      summary: Update SCR-006 work & life answers (12 fields)
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerPatch" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/offers/{offerId}/growth:
    parameters: [{ $ref: "#/components/parameters/OfferId" }]
    patch:
      tags: [Offers]
      summary: Update SCR-007 growth answers (12 fields)
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerPatch" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/offers/{offerId}/culture:
    parameters: [{ $ref: "#/components/parameters/OfferId" }]
    patch:
      tags: [Offers]
      summary: Update SCR-008 culture & manager answers
      description: >
        guestOrAuth. `offer_notes` (private notes) is stored here and is
        **never scored**, and is excluded from culture signal contribution
        even when the relevant consent toggle is On.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerPatch" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/offers/{offerId}/compute-score:
    parameters: [{ $ref: "#/components/parameters/OfferId" }]
    post:
      tags: [Scoring]
      summary: Compute and persist this offer's score
      description: >
        guestOrAuth. Scores the offer's current answers against the
        `OgScoringConfig` version pinned to its evaluation session — never
        "whatever is currently active" — and upserts the result into
        `offer_scores`, stamping the `scoringConfigVersion` that produced it.


        Safe to call repeatedly: each call re-scores from scratch and
        overwrites the prior result. Under an unchanged config it reproduces
        identical output. Reading a score back without recomputing is
        `GET ../score`.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      responses:
        "201":
          description: Score computed and persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferScoreResult" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/offers/{offerId}/score:
    parameters: [{ $ref: "#/components/parameters/OfferId" }]
    get:
      tags: [Scoring]
      summary: Read this offer's stored score without recomputing
      description: >
        guestOrAuth. Returns the persisted `offer_scores` row as-is, so
        revisiting SCR-010 shows the numbers that were computed before rather
        than silently re-running the engine against a config that may have
        been retuned since. 404 when the offer has never been scored — a
        zeroed score would be indistinguishable from a genuinely bad offer.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferScoreResult" }
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Wizard draft — operations 22–24
  # ===========================================================================
  /api/offerguide/wizard-draft:
    get:
      tags: [Wizard Draft]
      summary: Get the caller's saved draft
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WizardDraft" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Wizard Draft]
      summary: Upsert the caller's draft
      description: >
        guestOrAuth. Autosaved on field blur and step change. The document
        carries a 30-day TTL index — unlike guest *profile* data, which has
        no automatic expiry.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WizardDraft" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WizardDraft" }
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Wizard Draft]
      summary: Discard the caller's draft
      description: >
        guestOrAuth. Idempotent — 204 whether or not a draft existed, and
        whether or not an identity is present.
      security: [{ BearerAuth: [] }, { GuestCookie: [] }]
      responses:
        "204":
          description: Discarded

  # ===========================================================================
  # Public config reads — operations 25–28. No auth of any kind.
  # ===========================================================================
  /api/offerguide/config/questions:
    get:
      tags: [Public Config]
      summary: Question definitions for one screen (candidate-safe)
      description: >
        PUBLIC. Returns the `QuestionPublic` shape only. **This is a data-leak
        boundary**: no `scoreType`, no option `score` values, no
        `numericBands`, no `nullScore`, no `ratingMultiplier`, and no
        `options[].active` appears in the response for any screen — a
        candidate must not be able to reverse-engineer scoring from the
        network tab. Retired questions and retired options are omitted.
      parameters:
        - name: screen
          in: query
          required: true
          schema: { type: string, example: SCR-006 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuestionPublic" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/offerguide/config/consent-toggles:
    get:
      tags: [Public Config]
      summary: Consent toggle definitions
      description: >
        PUBLIC. One master toggle (`consent_share_anonymous`) plus five
        sub-toggles, master first. Read from `OgConsentToggles`, never
        hardcoded — retiring a sub-toggle in the admin API removes it from the
        UI with no deploy.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsentTogglePublic" }

  /api/offerguide/config/geography:
    get:
      tags: [Public Config]
      summary: Countries, or the cities of one country
      description: >
        PUBLIC. Without `countryCode`, returns active countries. With it,
        returns that country's active cities. Powers a dependent dropdown; it
        does not constrain what `current_city` / `offer_city` may store, since
        the free-text escape hatch always exists.
      parameters:
        - name: countryCode
          in: query
          required: false
          schema: { type: string, example: PK }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/GeographyCountryPublic" }
                  - type: array
                    items: { $ref: "#/components/schemas/GeographyCityPublic" }

  /api/offerguide/config/functional-domains:
    get:
      tags: [Public Config]
      summary: Functional domain options (SCR-003)
      description: PUBLIC.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FunctionalDomainPublic" }

  # ===========================================================================
  # Admin config — OgQuestions — operations 29–33
  # ===========================================================================
  /api/offerguide/admin/config/questions:
    get:
      tags: [Admin Config]
      summary: List all questions (full QuestionAdmin shape)
      description: >
        adminAuth. Returns retired (`active: false`) documents too — the admin
        view is exactly where a soft-deleted document must stay visible.
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuestionAdmin" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin Config]
      summary: Create a question
      description: >
        adminAuth. Category composition is field-driven: a new question with
        `category: Growth` joins the Growth average on the next scoring run
        with no code change.
      security: [{ AdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionAdmin" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionAdmin" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/offerguide/admin/config/questions/{fieldId}:
    parameters: [{ $ref: "#/components/parameters/FieldId" }]
    get:
      tags: [Admin Config]
      summary: Get a question by fieldId
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionAdmin" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Admin Config]
      summary: Update a question (partial merge)
      security: [{ AdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionAdmin" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionAdmin" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin Config]
      summary: Retire a question (soft delete)
      description: >
        adminAuth. Sets `active: false` and returns the retired document.
        Nothing is hard-deleted — a retired question still explains the
        meaning of evaluations scored while it was live. It disappears from
        `GET /config/questions` and stops feeding the category average, but
        stays in the admin list.
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: "Retired — the returned document has active: false"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionAdmin" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

