  # Admin config — scoring (immutable) — operations 34–36
  # ===========================================================================
  /api/offerguide/admin/config/scoring:
    get:
      tags: [Admin Config]
      summary: List all scoring config versions
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScoringConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin Config]
      summary: Create a new scoring config version
      description: >
        adminAuth. **Versions are immutable.** There is deliberately no PUT or
        PATCH on this collection anywhere in the API — editing an existing
        version is not a route that rejects requests, it is a route that does
        not exist. Re-POSTing an existing version number returns 400.
        Creating a new version leaves previously computed scores untouched.
      security: [{ AdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoringConfig" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringConfig" }
        "400":
          description: Missing version, or that version already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/offerguide/admin/config/scoring/{version}:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: integer }
        description: The version number recorded on an `offer_scores` row.
    get:
      tags: [Admin Config]
      summary: Get one scoring config version
      description: >
        adminAuth. The audit read path: resolves the `scoringConfigVersion`
        stamped on a stored score back to the exact weights behind it.
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/admin/config/scoring/{version}/activate:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: integer }
        description: The version to make active.
    post:
      tags: [Admin Config]
      summary: Activate a scoring config version
      description: >
        adminAuth. Sprint 10. Flips `isActive` on exactly one version, in a
        transaction — every other version off, this one on. Does NOT modify a
        version's scoring content: versions remain immutable, this moves only
        the active pointer that `POST /evaluation-sessions` reads. Re-activating
        the already-active version is a no-op that still returns 200.
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: The newly-active config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/offerguide/admin/config/scoring/{version}/preview:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: integer }
        description: The version to preview against the currently active one.
    get:
      tags: [Admin Config]
      summary: Preview a scoring version against the golden fixtures
      description: >
        adminAuth. Sprint 10. Scores the five golden fixtures under the
        currently active config and under {version}, side by side, so an admin
        can see the impact before activating. Read-only — never writes an
        `offer_scores` row, hence GET despite doing real computation. Works for
        any version, not just drafts. 404 if the version does not exist, or if
        no active version exists to compare against.
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: Both scored results per fixture; the client computes deltas.
          content:
            application/json:
              schema:
                type: object
                required: [activeVersion, previewVersion, fixtures]
                properties:
                  activeVersion: { type: integer }
                  previewVersion: { type: integer }
                  fixtures:
                    type: array
                    items:
                      type: object
                      required: [fixtureId, label, active, preview]
                      properties:
                        fixtureId: { type: string, example: A }
                        label: { type: string }
                        active: { $ref: "#/components/schemas/FixtureScore" }
                        preview: { $ref: "#/components/schemas/FixtureScore" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

