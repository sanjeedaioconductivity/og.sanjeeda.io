components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The portal's own JWT. On a `guestOrAuth` route it takes precedence
        over the guest cookie when both are present.
    GuestCookie:
      type: apiKey
      in: cookie
      name: guestToken
      description: >
        httpOnly cookie minted by `POST /candidate-profile` when no identity
        is present. **Swagger UI cannot attach this** — verify guest-mode
        behaviour outside Swagger with `curl -b` or a browser session.
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The portal's own JWT, belonging to an account whose stored `role` is
        `admin` (Sprint 9). The same credential as `BearerAuth` — what separates
        the two is the account behind the token, not anything the client sends.

        The role is read from `sanjeedausers` on every check rather than taken
        from a token claim, so a demotion applies immediately instead of at the
        next expiry. Authorization is expressed as the `portal.admin.access`
        permission, resolved through the static role→permission map in
        `src/lib/portal/permissions.ts`; no call site compares the role directly.

        Fails closed. No token, an expired token, a token for a deleted account,
        an unrecognised role, or a database error all resolve to the public tier,
        which does not hold `portal.admin.access`.

        Sprint 9 replaced an interim env-configured header gate here. It was
        removed entirely rather than kept as a fallback — there is no second way
        into these routes.

  parameters:
    MongoId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Mongo ObjectId
    FieldId:
      name: fieldId
      in: path
      required: true
      schema: { type: string }
      example: offer_working_hours
    CountryCode:
      name: countryCode
      in: path
      required: true
      schema: { type: string }
      example: PK
    DomainId:
      name: domainId
      in: path
      required: true
      schema: { type: string }
    ToggleId:
      name: toggleId
      in: path
      required: true
      schema: { type: string }
      example: consent_salary_ranges
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: integer }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials for this operation's auth mode
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: >
        Not found — also returned when the resource belongs to another
        candidate, so the contract never confirms that someone else's data
        exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }

    # ----------------------------------------------------------- candidate
    ConsentSettings:
      type: object
      description: >
        Candidate-level, stored on `candidate_profiles.consentSettings`.
        Every toggle defaults to **Off** — privacy-first. When
        `shareAnonymous` is false, every selection is treated as Off
        regardless of its stored value, and the sub-toggles are dimmed in the
        UI. Framing is anonymised throughout: no copy implies personal data is
        shared.
      properties:
        shareAnonymous:
          type: boolean
          default: false
          description: The master toggle, `consent_share_anonymous`.
        selections:
          type: object
          additionalProperties: { type: boolean }
          description: >
            Keyed by `toggleId`. Validated against `OgConsentToggles`, so an
            unknown or retired id is rejected with 400.

    CandidateProfile:
      type: object
      description: >
        SCR-001. 24 fields, of which only `careerStage` and
        `preferredWorkArrangement` are required. One profile per identity;
        a return visit updates it rather than creating a second.
      properties:
        id: { type: integer, readOnly: true }
        userInfoId:
          type: integer
          nullable: true
          description: Null while the candidate is a guest.
        guestToken:
          type: string
          nullable: true
          readOnly: true
        careerStage: { type: string }
        preferredWorkArrangement: { type: string }
        currentCountry: { type: string, nullable: true }
        currentCity: { type: string, nullable: true }
        consentSettings: { $ref: "#/components/schemas/ConsentSettings" }
      additionalProperties: true

    # --------------------------------------------------------------- session
    EvaluationSession:
      type: object
      description: SCR-002. Three required fields.
      properties:
        id: { type: integer, readOnly: true }
        candidateProfileId: { type: integer, readOnly: true }
        evaluationType: { type: string }
        evaluationOfferCount:
          type: string
          description: >
            "One offer" gates SCR-010's community insight card — it is shown
            for single-offer sessions only.
        evaluationPriorities:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 3
          description: >
            1–3 selections, enforced with a live counter on SCR-002. Each one
            resolves through `OgScoringConfig.priorityCategoryMap` to add
            `priorityBoost` to the matching category weight.
        evaluationPriorityOtherText:
          type: string
          nullable: true
          description: Stored, and not mapped to any category.
        scoringConfigVersion:
          type: integer
          readOnly: true
          description: >
            Pinned at creation time. Every score computed in this session is
            stamped with it, so retuning weights later never shifts an
            already-computed score.

    SessionComparison:
      type: object
      description: SCR-009's comparison. The winner is decided server-side.
      properties:
        sessionId: { type: integer }
        evaluationOfferCount: { type: string, nullable: true }
        offerCount: { type: integer }
        bestOverallScore:
          type: integer
          nullable: true
          description: Null when no offer in the session has been scored.
        isTie:
          type: boolean
          description: True when more than one offer shares the top score.
        winnerOfferIds:
          type: array
          items: { type: integer }
          description: >
            A list, not a single id — a tie badges **both** offers rather than
            arbitrarily picking one.
        offers:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              label: { type: string, nullable: true }
              companyName: { type: string, nullable: true }
              roleTitle: { type: string, nullable: true }
              offerWorkArrangement: { type: string, nullable: true }
              isWinner: { type: boolean }
              score:
                allOf: [{ $ref: "#/components/schemas/OfferScoreResult" }]
                nullable: true

    # ----------------------------------------------------------------- offer
    Offer:
      type: object
      description: SCR-003 offer detail fields.
      properties:
        id: { type: integer, readOnly: true }
        evaluationSessionId: { type: integer, readOnly: true }
        label: { type: string, nullable: true, example: Offer A }
        companyName: { type: string, nullable: true }
        roleTitle: { type: string, nullable: true }
        offerFunctionalDomain: { type: string, nullable: true }
        offerReceivedDate: { type: string, format: date, nullable: true }
        offerCountry: { type: string, nullable: true }
        offerCity: { type: string, nullable: true }
        offerWorkArrangement: { type: string }
        offerEmploymentType: { type: string }
        offerContractDuration: { type: string, nullable: true }
        offerProbation:
          type: string
          nullable: true
          description: >
            Documented enum override — its "Not clear" scores **20**, not the
            standard 45, because an unstated probation period is a risk
            signal rather than neutral uncertainty.
        reportingLevel: { type: string, nullable: true }
      additionalProperties: true

    OfferFull:
      allOf:
        - $ref: "#/components/schemas/Offer"
        - type: object
          properties:
            compensation: { $ref: "#/components/schemas/AnswerPatch" }
            benefitsSecurity: { $ref: "#/components/schemas/AnswerPatch" }
            workLife: { $ref: "#/components/schemas/AnswerPatch" }
            growth: { $ref: "#/components/schemas/AnswerPatch" }
            culture: { $ref: "#/components/schemas/AnswerPatch" }

    AnswerPatch:
      type: object
      description: >
        A flat set of that screen's answer fields, camelCase. Partial merge —
        only the fields sent are changed. The authoritative per-screen field
        inventory is each screen's FRS (verified in Story 8.2.1), not this
        schema. Enum values, including the "Not clear / Not sure / Not
        applicable" terminology standard, are validated server-side against
        `OgQuestions`; selecting "Other" requires its paired free-text field.
      additionalProperties: true

    OfferScoreResult:
      type: object
      description: >
        Everything SCR-010 renders. Every value here is READ — the client must
        never recompute, re-derive or "sanity-check" any of it.
      properties:
        offerId: { type: integer }
        salaryScore:
          type: integer
          description: >
            Computed by the dedicated market-percentile formula against
            `OgMarketBenchmarks` and **excluded from generic category
            averaging** entirely. The benchmark pool degrades in stages —
            role match, then location match, then the full pool — and falls
            back to a flat score when no base salary was entered or the
            collection is empty.
        benefitsScore: { type: integer }
        stabilityScore:
          type: integer
          description: >
            `offer_restrictive_clause` scores into **Stability**, not
            Benefits. Its "Not clear" is the second documented enum override,
            scoring 65 rather than 45.
        worklifeScore: { type: integer }
        growthScore: { type: integer }
        cultureScore:
          type: integer
          description: >
            Each `offer_red_flags` selection applies a fixed penalty here;
            "Other" counts as one additional flag. `offer_notes` is never
            scored.
        purposeScore:
          type: integer
          description: >
            Composed of exactly one field, `offer_purpose_sense`.
            `offer_values_alignment` scores into Culture and does not feed
            Purpose.
        overallScore:
          type: integer
          description: Weighted average across all 7 categories.
        recommendationLabel:
          type: string
          description: SCR-010 §6.1 — four thresholds, four labels.
          enum:
            - Excellent fit — strong offer
            - Good fit — negotiate a few points
            - Moderate fit — clarify concerns
            - Weak fit — proceed carefully
        strengths:
          type: array
          description: Categories scoring ≥ 75, descending, max 4.
          items:
            type: object
            properties:
              category: { type: string }
              score: { type: integer }
        watchOuts:
          type: array
          items: { type: string }
          description: Score-based first, then field-signal. Max 5.
        nextSteps:
          type: array
          items: { type: string }
          description: >
            By triggering category score ascending, max 4, with the
            "Request written confirmation of key terms" fallback when nothing
            else triggers.
        scoreBreakdown:
          type: object
          description: Per-category weights, per-field scores, and the salary detail.
        scoringConfigVersion:
          type: integer
          description: >
            Recorded on every score row. Re-running compute-score under an
            unchanged config reproduces identical output.
        fieldScoringRulesVersion: { type: integer }

    # ---------------------------------------------------------- wizard draft
    WizardDraft:
      type: object
      required: [currentScreen]
      properties:
        currentScreen: { type: string, example: SCR-004 }
        answers:
          type: object
          additionalProperties: true
        candidateProfileId: { type: integer, nullable: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    # -------------------------------------------------------- public config
    QuestionPublic:
      type: object
      description: >
        The candidate-safe projection. Note what is **absent**: `scoreType`,
        `category`, option `score` values, `numericBands`, `nullScore`,
        `ratingMultiplier`, `options[].active`.
      properties:
        fieldId: { type: string }
        screen: { type: string }
        label: { type: string }
        helpText: { type: string }
        uiControl: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              sortOrder: { type: integer }

    ConsentTogglePublic:
      type: object
      properties:
        toggleId: { type: string }
        label: { type: string }
        helpText: { type: string }
        sourceScreen: { type: string }
        isMaster: { type: boolean }

    GeographyCountryPublic:
      type: object
      properties:
        countryCode: { type: string, example: PK }
        countryName: { type: string, example: Pakistan }

    GeographyCityPublic:
      type: object
      properties:
        cityId: { type: string }
        name: { type: string }

    FunctionalDomainPublic:
      type: object
      properties:
        domainId: { type: string }
        name: { type: string }

    # --------------------------------------------------------- admin config
    QuestionOption:
      type: object
      required: [value, score]
      properties:
        value: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean, default: true }
        score: { type: number }

    NumericBand:
      type: object
      required: [score]
      properties:
        upTo:
          type: number
          description: Omit on the last band to mean "no upper limit".
        score: { type: number }

    QuestionAdmin:
      type: object
      required: [fieldId, screen, category, label, helpText, uiControl, scoreType]
      properties:
        fieldId: { type: string, example: offer_working_hours }
        screen: { type: string, example: SCR-006 }
        category:
          type: string
          description: >
            **This field alone determines category composition.** The scoring
            engine groups questions by it at query time — there is no
            field-to-category map in code, so reassigning a question here
            changes scoring on the next run with no deploy.
          enum: [Benefits, Stability, Work-Life, Growth, Culture, Purpose]
        label: { type: string }
        helpText: { type: string }
        uiControl: { type: string }
        scoreType:
          type: string
          enum: [enum, rating, numeric]
          description: >
            "yesno" is retired (Sprint 5) — the scoring engine treats it as a
            data bug, not a supported type. The enum scale is 100 / 65 / 45 /
            20, with two documented per-field overrides
            (`offer_probation`, `offer_restrictive_clause`).
        options:
          type: array
          items: { $ref: "#/components/schemas/QuestionOption" }
        ratingMultiplier:
          type: number
          default: 20
          description: Rating fields resolve as 1–5 × this.
        numericBands:
          type: array
          items: { $ref: "#/components/schemas/NumericBand" }
          description: >
            Used by `offer_working_hours`, `offer_commute_minutes` and
            `offer_annual_leave_days`.
        nullScore:
          type: number
          default: 45
          description: Applied when the answer is blank.
        active:
          type: boolean
          default: true
          description: Set false by the soft-delete DELETE. Never hard-deleted.
        sortOrder: { type: integer, default: 0 }

    ScoringConfig:
      type: object
      required: [version]
      description: >
        Immutable once created. The importance-slider and `evaluationType`
        weighting layers are live infrastructure shipping at their default
        settings, with no real-world tuning applied yet.
      properties:
        version: { type: integer }
        effectiveFrom: { type: string, format: date-time }
        isActive: { type: boolean }
        categoryBaseWeights:
          type: object
          additionalProperties: { type: number }
          description: Base weight 1.0 per category.
        priorityBoost:
          type: number
          default: 1.2
          description: Added per `evaluationPriorities` selection.
        priorityCategoryMap:
          type: object
          additionalProperties: { type: string }
          description: >
            SCR-010 §7's mapping, authoritative over SCR-002's stale
            pre-taxonomy prose. Includes `Security → Stability` and
            `Flexibility / Commute → Work-Life`.
        importanceWeighting:
          type: object
          description: >
            `offer_worklife_importance`, `offer_growth_importance` and
            `offer_culture_importance` adjust their category weights and are
            **not** themselves scored as questions.
        evaluationTypeBonus: { type: object }

    GeographyCity:
      type: object
      required: [cityId, name]
      properties:
        cityId: { type: string }
        name: { type: string }
        active: { type: boolean, default: true }

    Geography:
      type: object
      required: [countryCode, countryName]
      properties:
        countryCode: { type: string, example: PK }
        countryName: { type: string, example: Pakistan }
        active: { type: boolean, default: true }
        cities:
          type: array
          items: { $ref: "#/components/schemas/GeographyCity" }

    MarketBenchmark:
      type: object
      required: [role, location, currency, p25, p50, p75]
      properties:
        role: { type: string }
        location: { type: string }
        currency: { type: string }
        p25: { type: number }
        p50: { type: number }
        p75: { type: number }
        sampleSize: { type: integer, default: 0 }
        effectiveFrom: { type: string, format: date-time }
        active: { type: boolean, default: true }

    FixtureScore:
      type: object
      description: One fixture scored under one config — the unit the preview diffs.
      required: [categoryScores, overallScore, recommendationLabel]
      properties:
        categoryScores:
          type: object
          description: Score per category (Salary, Benefits, Stability, Work-Life, Growth, Culture, Purpose).
          additionalProperties: { type: number }
        overallScore: { type: number }
        recommendationLabel: { type: string, example: "Excellent fit — strong offer" }

    FunctionalDomain:
      type: object
      required: [domainId, name]
      properties:
        domainId: { type: string }
        name: { type: string }
        active: { type: boolean, default: true }
        sortOrder: { type: integer, default: 0 }

    ConsentToggle:
      type: object
      required: [toggleId, label, helpText, sourceScreen]
      properties:
        toggleId: { type: string, example: consent_salary_ranges }
        label: { type: string }
        helpText: { type: string }
        sourceScreen: { type: string, example: SCR-004 }
        isMaster:
          type: boolean
          default: false
          description: >
            True only for `consent_share_anonymous`. Retiring that toggle
            returns 409.
        active: { type: boolean, default: true }
        sortOrder: { type: integer, default: 0 }
